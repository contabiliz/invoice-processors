[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-processors"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber",
    "PyMuPDF",
]

[tool.hatch.build.targets.wheel]
packages = ["src/processors"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
