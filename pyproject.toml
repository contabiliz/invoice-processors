[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-processors"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber",
    "PyMuPDF",
    "lxml",
    "invoice-models",
]

[tool.uv.sources]
invoice-models = { git = "https://github.com/contabiliz/invoice-models.git", tag = "v1.5.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/processors"]

[project.optional-dependencies]
dev = ["python-semantic-release"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
tag_format = "v{version}"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
]
