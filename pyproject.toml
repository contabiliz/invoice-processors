[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-processors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber",
    "PyMuPDF",
    "invoice-models",
]

[tool.uv.sources]
invoice-models = { git = "https://github.com/contabiliz/invoice-models.git", tag = "v1.0.2" }

[tool.hatch.build.targets.wheel]
packages = ["src/processors"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
