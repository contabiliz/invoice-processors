name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git credentials
        run: git config --global http.https://github.com/.extraheader "Authorization: Basic $(echo -n x-access-token:${{ secrets.GH_TOKEN }} | base64)"

      - run: uv sync

      - run: uvx ruff check
